[platformio]
default_envs = dial

[env]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17
build_unflags = -std=gnu++11

[env:dial]
board = m5stack-stamps3
board_build.embed_files = assets/orc_badge_104.png
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  m5stack/M5Dial@1.0.3
  m5stack/M5Unified@0.2.24
  m5stack/M5GFX@0.2.31
build_src_filter = +<*> -<receiver.cpp>

[env:receiver]
board = esp32dev
build_src_filter = +<receiver.cpp> -<main.cpp> -<link.cpp> -<ui.cpp>
