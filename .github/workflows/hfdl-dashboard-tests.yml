name: HFDL host layout and frontend
on:
  push:
    branches:
      - "chatgpt/hfdl-dashboard-decoder"
    paths:
      - "apps/orcsdr-tab5/ui/hfdl_*"
      - "apps/orcsdr-tab5/hfdl/**"
      - "apps/orcsdr-tab5/tests/hfdl_*"
      - "tests/hfdl_*"
      - "tools/test-hfdl-dashboard.sh"
      - ".github/workflows/hfdl-dashboard-tests.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hfdl-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run HFDL host tests
        run: bash tools/test-hfdl-dashboard.sh
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfdl-test-results
          path: build/hfdl-dashboard/test.log
      - name: Preserve failing compiler diagnostics in research branch
        if: failure()
        run: |
          mkdir -p docs/evidence/hfdl
          cp build/hfdl-dashboard/test.log docs/evidence/hfdl/ci-failure.log
          git config user.name "OrcSDR HFDL CI"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/hfdl/ci-failure.log
          git commit -m "test(hfdl): preserve failing host diagnostic [skip ci]"
          git push origin HEAD:"$GITHUB_REF_NAME"
