name: Waveshare 4B native compile + REA source evidence
on:
  push:
    branches: [codex/waveshare-p4-4b-port, codex/waveshare-4b-fm-dashboard]
    paths:
      - "apps/orcsdr-waveshare-4b/**"
      - "tools/hardware/rea_graphics_source_audit.py"
      - ".github/workflows/waveshare-4b-build.yml"
  pull_request:
    paths:
      - "apps/orcsdr-waveshare-4b/**"
      - "tools/hardware/rea_graphics_source_audit.py"
      - ".github/workflows/waveshare-4b-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    container:
      image: espressif/idf:v5.5.4@sha256:b9f2d6ea1c19e0c9f7959bdb74a9e3c775642f9d0f3b841937c5fa3363db892b
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Source-only call-chain evidence from pinned upstream BSP revision
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE/research-out"
          curl --fail --location --retry 3 --silent --show-error \
            "https://raw.githubusercontent.com/waveshareteam/Waveshare-ESP32-components/23a6012d5e87d27399cf90fb851cab3689e29159/bsp/esp32_p4_wifi6_touch_lcd_4b/esp32_p4_wifi6_touch_lcd_4b.c" \
            -o "$GITHUB_WORKSPACE/research-out/waveshare-bsp.c"
          python3 tools/hardware/rea_graphics_source_audit.py \
            --bsp "$GITHUB_WORKSPACE/research-out/waveshare-bsp.c" \
            --tab5-ui apps/orcsdr-tab5/ui --out-dir "$GITHUB_WORKSPACE/research-out"
      - name: Compile 4B probe on pinned ESP-IDF 5.5.4 (NO flash)
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh" >/dev/null
          cd apps/orcsdr-waveshare-4b
          idf.py -B build-4b -D SDKCONFIG=build-4b/sdkconfig set-target esp32p4 \
            2>&1 | tee "$GITHUB_WORKSPACE/research-out/idf-set-target.log"
          idf.py -B build-4b -D SDKCONFIG=build-4b/sdkconfig build \
            2>&1 | tee "$GITHUB_WORKSPACE/research-out/idf-build.log"
          cp dependencies.lock "$GITHUB_WORKSPACE/research-out/dependencies.lock"
          cp build-4b/orcsdr_waveshare_4b_probe.elf "$GITHUB_WORKSPACE/research-out/4b-probe.elf"
          cp build-4b/orcsdr_waveshare_4b_probe.bin "$GITHUB_WORKSPACE/research-out/4b-home-app-0x10000.bin"
          cp build-4b/bootloader/bootloader.bin "$GITHUB_WORKSPACE/research-out/4b-bootloader-0x2000.bin"
          cp build-4b/partition_table/partition-table.bin "$GITHUB_WORKSPACE/research-out/4b-partition-table-0x8000.bin"
          cp build-4b/sdkconfig "$GITHUB_WORKSPACE/research-out/sdkconfig"
          ( cd "$GITHUB_WORKSPACE/research-out" && sha256sum 4b-*.bin 4b-probe.elf > SHA256SUMS.txt )
          printf "DEVELOPER-ONLY / WAVESHARE ESP32-P4-WIFI6-TOUCH-LCD-4B\n" > "$GITHUB_WORKSPACE/research-out/DO-NOT-FLASH-BLINDLY.txt"
          printf "NOT PHYSICALLY VERIFIED. Check the board, flash size and P4 silicon revision before flashing.\n" >> "$GITHUB_WORKSPACE/research-out/DO-NOT-FLASH-BLINDLY.txt"
          printf "No C6 image included. Do not use M5Stack Tab5 firmware on this board.\n" >> "$GITHUB_WORKSPACE/research-out/DO-NOT-FLASH-BLINDLY.txt"
      - name: Save exact source/build/ELF evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: waveshare-4b-native-build-evidence
          path: research-out/
          retention-days: 14
      - name: Result
        if: success()
        run: echo "Waveshare 4B P4 probe compiled; no hardware flashed, no REA/Ghidra binary run." >> "$GITHUB_STEP_SUMMARY"

  rea-owned-elf:
    name: REA/Ghidra analysis of own 4B probe ELF
    needs: native-build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: waveshare-4b-native-build-evidence
          path: research-out/
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.11.1"
      - name: Install JDK 21 and verified Ghidra 12.1.4
        env:
          GHIDRA_ARCHIVE: ghidra_12.1.4_PUBLIC_20260921.zip
          GHIDRA_SHA256: ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y openjdk-21-jdk-headless unzip
          echo "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 --retry-delay 3 \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/$GHIDRA_ARCHIVE" \
            -o "$RUNNER_TEMP/$GHIDRA_ARCHIVE"
          echo "$GHIDRA_SHA256  $RUNNER_TEMP/$GHIDRA_ARCHIVE" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/$GHIDRA_ARCHIVE" -d "$RUNNER_TEMP"
          echo "GHIDRA_INSTALL_DIR=$RUNNER_TEMP/ghidra_12.1.4_PUBLIC" >> "$GITHUB_ENV"
      - name: Install pinned REA CLI
        run: |
          npm install --global rea-agents@6.4.0
          node --version
          rea --version
      - name: Analyze owned Waveshare ELF (never flashes hardware)
        run: |
          python3 tools/hardware/rea_graphics_binary.py \
            --target research-out/4b-probe.elf --out rea-graphics
      - name: Preserve complete REA/Ghidra evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: waveshare-4b-rea-ghidra-evidence
          path: rea-graphics/
          retention-days: 14
