name: Cardputer Zero Linux host smoke

on:
  push:
    branches:
      - codex/cardputer-zero-linux-bringup-20261102
      - agents/cardputer-zero-orcdec-20261106
    paths:
      - 'apps/orcsdr-cardputer-zero/**'
      - 'apps/orcsdr-tab5/ui/acars_core.*'
      - 'apps/orcsdr-tab5/ui/acars_selftest.*'
      - 'apps/orcsdr-tab5/ui/adsb_decoder.*'
      - '.github/workflows/cardputer-zero-host.yml'
  pull_request:
    paths:
      - 'apps/orcsdr-cardputer-zero/**'
      - 'apps/orcsdr-tab5/ui/acars_core.*'
      - 'apps/orcsdr-tab5/ui/acars_selftest.*'
      - 'apps/orcsdr-tab5/ui/adsb_decoder.*'
      - '.github/workflows/cardputer-zero-host.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-host:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-24.04", "ubuntu-24.04-arm"]
        rtl: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@v4
      - name: Install host rtl-sdr development package
        if: matrix.rtl == 'ON'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config librtlsdr-dev
          pkg-config --modversion librtlsdr
      - name: Record runner architecture
        run: uname -m | tee cardputer-zero-architecture.log
      - name: Configure
        run: |
          set -o pipefail
          cmake -S apps/orcsdr-cardputer-zero -B build/cardputer-zero-ci -DCMAKE_BUILD_TYPE=Release -DORC_ENABLE_RTLSDR=${{ matrix.rtl }} 2>&1 | tee cardputer-zero-configure.log
      - name: Build
        run: |
          set -o pipefail
          cmake --build build/cardputer-zero-ci --parallel 2>&1 | tee cardputer-zero-build.log
      - name: Run deterministic decoder / IQ tests
        run: |
          set -o pipefail
          ctest --test-dir build/cardputer-zero-ci --output-on-failure --verbose 2>&1 | tee cardputer-zero-ctest.log
      - name: Check application CLI
        run: |
          set -o pipefail
          ./build/cardputer-zero-ci/orcsdr_cardputer_zero --demo 2>&1 | tee cardputer-zero-demo.log
      - name: Check library-enabled device enumeration (no RF hardware in CI)
        if: matrix.rtl == 'ON'
        run: |
          set -o pipefail
          ./build/cardputer-zero-ci/orcsdr_cardputer_zero --list 2>&1 | tee cardputer-zero-list.log
      - name: Preserve per-run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardputer-zero-${{ matrix.os }}-rtl-${{ matrix.rtl }}
          path: cardputer-zero-*.log
          if-no-files-found: warn
          retention-days: 14
