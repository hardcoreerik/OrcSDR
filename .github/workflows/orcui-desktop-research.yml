name: OrcUI Desktop Research
on:
  push:
    branches:
      - codex/orcui-adaptive-display-poc
    paths:
      - 'experiments/orcui/**'
      - '.github/workflows/orcui-desktop-research.yml'
  pull_request:
    paths:
      - 'experiments/orcui/**'
      - '.github/workflows/orcui-desktop-research.yml'
  workflow_dispatch:
jobs:
  geometry:
    name: Host geometry and raster (Release)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build host regressions
        run: |
          cmake -S experiments/orcui/tests -B build-orcui-tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build-orcui-tests --parallel 4
          ctest --test-dir build-orcui-tests --output-on-failure
  sdl-linux:
    name: LVGL 9.3 + SDL2 native simulator (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config libsdl2-dev gdb
      - name: Configure LVGL/SDL simulator
        run: |
          cmake -S experiments/orcui/desktop -B build-orcui-desktop \
            -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON
      - name: Build native simulator
        run: cmake --build build-orcui-desktop --parallel 4
      - name: SDL smoke tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          if ! ctest --test-dir build-orcui-desktop --output-on-failure; then
            echo "OrcUI SDL test failed; collecting GDB backtrace"
            gdb -batch -ex "set env SDL_VIDEODRIVER dummy" \
                -ex "set env SDL_AUDIODRIVER dummy" -ex run -ex "thread apply all bt" \
                --args build-orcui-desktop/orcui_desktop --preset waveshare --seconds 4 --cycle-ms 500
            exit 1
          fi
          mkdir -p build-orcui-desktop/screenshots
          build-orcui-desktop/orcui_desktop --preset waveshare --seconds 2 --screenshot build-orcui-desktop/screenshots/waveshare.bmp
          build-orcui-desktop/orcui_desktop --preset tab5 --seconds 2 --screenshot build-orcui-desktop/screenshots/tab5.bmp
          build-orcui-desktop/orcui_desktop --preset round480 --seconds 2 --screenshot build-orcui-desktop/screenshots/round480.bmp
          build-orcui-desktop/orcui_desktop --preset ultrawide --seconds 2 --screenshot build-orcui-desktop/screenshots/ultrawide.bmp
          python3 - <<'PY'
          import pathlib, struct
          folder = pathlib.Path("build-orcui-desktop/screenshots")
          expected = {"waveshare": (720,720), "tab5": (1088,612),
                      "round480":(480,480),"ultrawide":(1280,360)}
          for profile,(w,h) in expected.items():
              data=(folder/(profile+".bmp")).read_bytes()
              assert data[:2] == b"BM", profile
              actual=struct.unpack_from("<ii",data,18)
              print(profile, actual, len(data))
              assert actual == (w,h), (profile,actual)
              assert len(data) > 2000, profile
          PY
      - name: Store logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orcui-desktop-logs
          path: |
            build-orcui-desktop/Testing/Temporary/LastTest.log
            build-orcui-desktop/screenshots/*.bmp
          if-no-files-found: ignore
