name: Tab5 cadence and LoRa history

on:
  pull_request:
    paths:
      - 'apps/orcsdr-tab5/ui/**'
      - 'apps/orcsdr-tab5/dsp/dsp_stats.*'
      - 'tests/dsp_stage_stats_tests.cpp'
      - 'tests/home_cadence_tests.cpp'
      - 'tests/waterfall_style_tests.cpp'
      - 'tests/lora_history_tests.cpp'
      - 'tests/setup_navigation_pause_test.py'
      - 'tests/location_task_lifetime_test.py'
      - 'tests/orcdial_init_backoff_test.py'
      - 'tests/adsb_zoom_redraw_test.py'
      - 'tests/map_download_scheduling_test.py'
      - 'tests/map_worker_startup_test.py'
      - 'tests/map_download_task_lifetime_test.py'
      - 'tools/test-tab5-cadence-history.sh'
      - 'tools/test_home_receiver_header.py'
      - 'tools/test_iq_diagnostic_rate_gate.py'
      - 'tools/test_e4000_gain_serial.py'
      - 'tools/tab5_exact_response.py'
      - 'tools/serial_command_routes.py'
      - 'tools/tab5_serial_golden.py'
      - 'tests/serial_command_routes_test.py'
      - 'tests/serial_help_tests.cpp'
      - 'tests/serial_memory_tests.cpp'
      - 'tests/serial_keyboard_tests.cpp'
      - 'tests/serial_dead_air_tests.cpp'
      - 'tests/serial_dsp_tests.cpp'
      - 'tests/serial_pocsag_tests.cpp'
      - 'tests/serial_rds_tests.cpp'
      - 'tests/serial_p25_tests.cpp'
      - 'tests/serial_wifi_tests.cpp'
      - 'tests/serial_catalog_tests.cpp'
      - 'tests/serial_location_tests.cpp'
      - 'tests/serial_adsb_tests.cpp'
      - 'tests/serial_gain_tests.cpp'
      - 'tests/serial_driver_tests.cpp'
      - 'tests/serial_rtc_tests.cpp'
      - 'tests/serial_status_tests.cpp'
      - 'tests/serial_audio_tests.cpp'
      - 'tests/serial_audio_test_tests.cpp'
      - 'tests/serial_web_tests.cpp'
      - 'tests/serial_tune_tests.cpp'
      - 'tests/serial_signal_tests.cpp'
      - 'tests/serial_preset_tests.cpp'
      - 'tests/serial_scope_tests.cpp'
      - 'tests/serial_verbosity_tests.cpp'
      - 'tests/serial_health_tests.cpp'
      - 'tests/serial_lora_status_tests.cpp'
      - 'tests/serial_lora_tests.cpp'
      - 'tests/serial_bench_tests.cpp'
      - 'tests/serial_decoder_diag_tests.cpp'
      - 'tests/serial_ui_status_tests.cpp'
      - 'tests/serial_ui_nav_tests.cpp'
      - 'tests/memory_ledger_tests.cpp'
      - 'tests/buffer_claim_tests.cpp'
      - 'tests/sd_writer_tests.cpp'
      - 'tests/rds_capture_tests.cpp'
      - 'tests/audio_rec_tests.cpp'
      - 'tests/display_rotate_tests.cpp'
      - 'tests/serial_display_bench_tests.cpp'
      - 'tests/serial_rec_tests.cpp'
      - 'tests/serial_ui_debug_tests.cpp'
      - 'tests/serial_lab_vis_tests.cpp'
      - 'tests/serial_iq_tests.cpp'
      - 'tests/data/serial_help_golden.txt'
      - 'tests/data/serial_help_golden_orcdial.txt'
      - 'tests/data/serial_command_routes.tsv'
      - 'tests/data/serial_golden_unauthenticated.tsv'
      - '.github/workflows/tab5-cadence-history-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: bash tools/test-tab5-cadence-history.sh
      - name: Verify connected receiver label and bounded Home redraw
        run: python3 tools/test_home_receiver_header.py "$RUNNER_TEMP/home-receiver-header"
      - name: Verify diagnostic rate and serial parsers (no hardware)
        run: |
          python3 tools/test_iq_diagnostic_rate_gate.py
          python3 tools/test_e4000_gain_serial.py --self-check
          python3 tools/tab5_exact_response.py
      - name: Verify the serial dispatcher still matches its recorded route table (no hardware)
        run: |
          python3 tests/serial_command_routes_test.py
          python3 tools/tab5_serial_golden.py --self-check
