name: Documentation Truth

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One live run per PR: a new push cancels that PR's older run.
  # Every non-PR run (push to main, schedule, workflow_dispatch) gets its own
  # group via run_id, so it is never queued behind or cancelled by another run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Test documentation checker
        run: python -m unittest discover -s tests -p 'test_documentation_truth.py' -v
      - name: Check documentation truth
        run: python tools/check_documentation_truth.py
