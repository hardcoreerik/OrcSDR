name: SSTV Receiver Host Smoke
on:
  push:
    branches:
      - codex/sstv-native-dashboard
    paths:
      - "apps/orcsdr-tab5/ui/sstv_receiver.*"
      - "apps/orcsdr-tab5/ui/sstv_modes.cpp"
      - "tools/sstv_validate_timings.py"
      - "apps/orcsdr-tab5/tests/sstv_receiver_smoke.cpp"
      - "apps/orcsdr-tab5/tests/sstv_wav_replay.cpp"
      - ".github/workflows/sstv-receiver-tests.yml"
  pull_request:
    paths:
      - "apps/orcsdr-tab5/ui/sstv_receiver.*"
      - "apps/orcsdr-tab5/ui/sstv_modes.cpp"
      - "tools/sstv_validate_timings.py"
      - "apps/orcsdr-tab5/tests/sstv_receiver_smoke.cpp"
      - ".github/workflows/sstv-receiver-tests.yml"
jobs:
  host-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit 14 SSTV mode schedules against published wire timings
        run: python3 tools/sstv_validate_timings.py
      - name: Build host-only SSTV decoder
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Iapps/orcsdr-tab5/ui \
            apps/orcsdr-tab5/tests/sstv_receiver_smoke.cpp \
            apps/orcsdr-tab5/ui/sstv_receiver.cpp \
            apps/orcsdr-tab5/ui/sstv_modes.cpp -o /tmp/sstv-smoke
      - name: Build recorded-WAV replay tool
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Iapps/orcsdr-tab5/ui \
            apps/orcsdr-tab5/tests/sstv_wav_replay.cpp \
            apps/orcsdr-tab5/ui/sstv_receiver.cpp \
            apps/orcsdr-tab5/ui/sstv_modes.cpp -o /tmp/sstv-wav-replay
      - name: Synthetic Robot36 and progressive PD120 reception
        run: /tmp/sstv-smoke
