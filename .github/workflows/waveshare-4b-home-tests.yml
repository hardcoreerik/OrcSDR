name: Waveshare 4B Home host qualification
on:
  push:
    branches: [codex/waveshare-p4-4b-port, codex/waveshare-4b-fm-dashboard]
    paths:
      - "apps/orcsdr-waveshare-4b/main/**"
      - "apps/orcsdr-waveshare-4b/tests/**"
      - ".github/workflows/waveshare-4b-home-tests.yml"
  pull_request:
    paths:
      - "apps/orcsdr-waveshare-4b/main/**"
      - "apps/orcsdr-waveshare-4b/tests/**"
      - ".github/workflows/waveshare-4b-home-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  home-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate real-IQ log gate fixtures
        run: python3 -m unittest discover -s tools/hardware -p 'test_4b_home_log.py' -v
      - name: Verify 720x720 geometry, tune range and FFT known-tone fixture
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic apps/orcsdr-waveshare-4b/tests/home_host.cpp -o /tmp/orcsdr-home-4b
          /tmp/orcsdr-home-4b
      - name: Qualify proposed 720-square OrcSDR visual Home layout (not firmware)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            -Iapps/orcsdr-waveshare-4b/main \
            apps/orcsdr-waveshare-4b/tests/home_v2_layout_host.cpp \
            -o /tmp/orcsdr-home-v2-720
          /tmp/orcsdr-home-v2-720
      - name: Verify v3 badge-toggle drawer layout and state model
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            -Iapps/orcsdr-waveshare-4b/main \
            apps/orcsdr-waveshare-4b/tests/home_v3_drawer_host.cpp \
            -o /tmp/orcsdr-home-v3-drawer
          /tmp/orcsdr-home-v3-drawer

      - name: Verify all five Waveshare FM tab layouts and truthful feature states
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            -Iapps/orcsdr-waveshare-4b/main \
            apps/orcsdr-waveshare-4b/tests/fm_4b_layout_host.cpp \
            -o /tmp/orcsdr-fm-five-tabs
          /tmp/orcsdr-fm-five-tabs
