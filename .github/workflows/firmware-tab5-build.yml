name: Firmware Tab5 build

# Same compile the nightly runs (tools/ci/build-tab5.sh in the ESP-IDF 5.5.4
# container), on the pull request head. Does not publish a release.
on:
  pull_request:
    paths:
      - "apps/orcsdr-tab5/**"
      - "orcdial/c6/**"
      - "tools/ci/build-tab5.sh"
      - "tools/ci/build-hosted-c6.sh"
      - "tools/ci/fetch-world-map.sh"
      - "tools/release/hosted-c6-release.json"
      - ".github/workflows/firmware-tab5-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-tab5-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Radio scan core tests
        run: bash tools/test-radio-scan.sh
      - name: P25 core tests
        run: bash tools/test-p25-core.sh

  build:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: espressif/idf:v5.5.4@sha256:b9f2d6ea1c19e0c9f7959bdb74a9e3c775642f9d0f3b841937c5fa3363db892b
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          command -v jq >/dev/null || (apt-get update -qq && apt-get install -y -qq jq >/dev/null)
      - id: meta
        run: echo "build_id=pr $(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore ESP-Hosted C6 image
        id: c6cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-cache/hosted-c6
          key: hosted-c6-v1-${{ hashFiles('tools/release/hosted-c6-release.json', 'orcdial/c6/CMakeLists.txt', 'orcdial/c6/main/CMakeLists.txt', 'orcdial/c6/main/main.c', 'orcdial/c6/sdkconfig.defaults', 'orcdial/c6/partitions_eh_cp_ota_4m.csv', 'tools/ci/build-hosted-c6.sh') }}
      - name: Build ESP-Hosted C6 image
        if: steps.c6cache.outputs.cache-hit != 'true'
        run: . "$IDF_PATH/export.sh" >/dev/null && bash tools/ci/build-hosted-c6.sh --patch-idf .ci-cache/hosted-c6 "$RUNNER_TEMP/esp-hosted"
      - name: Fetch world map
        run: bash tools/ci/fetch-world-map.sh .ci-cache/world-map
      - name: Build Tab5 firmware
        run: . "$IDF_PATH/export.sh" >/dev/null && bash tools/ci/build-tab5.sh --c6 .ci-cache/hosted-c6/esp_hosted_tab5_c6.bin --world-map .ci-cache/world-map/world-overview-z4.pmtiles --out out --build-id "${{ steps.meta.outputs.build_id }}"
