name: Dead Air host tests
on:
  push:
    branches:
      - 'chatgpt/dead-air-*'
    paths:
      - 'apps/orcsdr-tab5/ui/dead_air_*'
      - 'tests/dead_air_model_tests.cpp'
      - 'tests/dead_air_render_tests.cpp'
      - 'tests/dead_air_sd_sink_tests.cpp'
      - 'tests/dead_air_sweep_tests.cpp'
      - 'tests/dead_air_palette_tests.cpp'
      - 'tests/dead_air_audio_tests.cpp'
      - 'tests/dead_air_clip_tests.cpp'
      - 'tests/dead_air_format_tests.cpp'
      - 'tests/dead_air_info_tests.cpp'
      - 'tests/dead_air_bandplan_tests.cpp'
      - 'tests/dead_air_control_tests.cpp'
      - 'tests/dead_air_fx_tests.cpp'
      - 'tests/dead_air_stats_tests.cpp'
      - 'tests/dead_air_env_tests.cpp'
      - 'tests/dead_air_envevents_tests.cpp'
      - 'tests/dead_air_envhistory_tests.cpp'
      - 'tests/dead_air_runes_tests.cpp'
      - 'tests/dead_air_runes_vectors.py'
      - 'tests/dead_air_veil26_tests.cpp'
      - 'tests/dead_air_veil26_log_tests.cpp'
      - 'tests/dead_air_journal_tests.cpp'
      - '.github/workflows/dead-air-host-tests.yml'
  pull_request:
    paths:
      - 'apps/orcsdr-tab5/ui/dead_air_*'
      - 'tests/dead_air_model_tests.cpp'
      - 'tests/dead_air_render_tests.cpp'
      - 'tests/dead_air_sd_sink_tests.cpp'
      - 'tests/dead_air_sweep_tests.cpp'
      - 'tests/dead_air_palette_tests.cpp'
      - 'tests/dead_air_audio_tests.cpp'
      - 'tests/dead_air_clip_tests.cpp'
      - 'tests/dead_air_format_tests.cpp'
      - 'tests/dead_air_info_tests.cpp'
      - 'tests/dead_air_bandplan_tests.cpp'
      - 'tests/dead_air_control_tests.cpp'
      - 'tests/dead_air_fx_tests.cpp'
      - 'tests/dead_air_stats_tests.cpp'
      - 'tests/dead_air_env_tests.cpp'
      - 'tests/dead_air_envevents_tests.cpp'
      - 'tests/dead_air_envhistory_tests.cpp'
      - 'tests/dead_air_runes_tests.cpp'
      - 'tests/dead_air_runes_vectors.py'
      - 'tests/dead_air_veil26_tests.cpp'
      - 'tests/dead_air_veil26_log_tests.cpp'
      - '.github/workflows/dead-air-host-tests.yml'
permissions:
  contents: read
jobs:
  dead-air-model:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile model with warnings as errors
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Iapps/orcsdr-tab5/ui \
            tests/dead_air_model_tests.cpp \
            apps/orcsdr-tab5/ui/dead_air_model.cpp \
            -o /tmp/dead-air-model-tests
      - name: Execute deterministic RF/event tests
        run: /tmp/dead-air-model-tests
      - name: Compile journal with warnings as errors
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Iapps/orcsdr-tab5/ui \
            tests/dead_air_journal_tests.cpp \
            apps/orcsdr-tab5/ui/dead_air_model.cpp \
            apps/orcsdr-tab5/ui/dead_air_journal.cpp \
            -o /tmp/dead-air-journal-tests
      - name: Execute deterministic journal tests
        run: /tmp/dead-air-journal-tests
      - name: Compile M5GFX renderer against host stand-in
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Itests/acars_ui_stubs -Iapps/orcsdr-tab5/ui \
            tests/dead_air_render_tests.cpp \
            tests/dead_air_ui_stubs/audio_header_stub.cpp \
            apps/orcsdr-tab5/ui/dead_air_dashboard.cpp \
            apps/orcsdr-tab5/ui/dead_air_runes.cpp \
            apps/orcsdr-tab5/ui/dead_air_sweep.cpp \
            apps/orcsdr-tab5/ui/dead_air_palette.cpp \
            apps/orcsdr-tab5/ui/dead_air_format.cpp \
            apps/orcsdr-tab5/ui/dead_air_info.cpp \
            apps/orcsdr-tab5/ui/acars_dirty_rects.cpp \
            apps/orcsdr-tab5/ui/dead_air_model.cpp \
            apps/orcsdr-tab5/ui/dead_air_bandplan.cpp \
            apps/orcsdr-tab5/ui/dead_air_fx.cpp \
            apps/orcsdr-tab5/ui/dead_air_envhistory.cpp \
            apps/orcsdr-tab5/ui/screen_controller.cpp \
            -o /tmp/dead-air-render-tests
      - name: Execute M5GFX render bounds and touch tests
        run: /tmp/dead-air-render-tests
      - name: Compile OrcSDR SD sink against host filesystem
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Iapps/orcsdr-tab5/ui \
            tests/dead_air_sd_sink_tests.cpp \
            apps/orcsdr-tab5/ui/dead_air_model.cpp \
            apps/orcsdr-tab5/ui/dead_air_journal.cpp \
            apps/orcsdr-tab5/ui/dead_air_sd_journal.cpp \
            -o /tmp/dead-air-sd-tests
      - name: Execute SD journal contract tests
        run: /tmp/dead-air-sd-tests
      - name: Compile sweep schedule and journal record with warnings as errors
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Iapps/orcsdr-tab5/ui \
            tests/dead_air_sweep_tests.cpp \
            apps/orcsdr-tab5/ui/dead_air_model.cpp \
            apps/orcsdr-tab5/ui/dead_air_journal.cpp \
            apps/orcsdr-tab5/ui/dead_air_sweep.cpp \
            -o /tmp/dead-air-sweep-tests
      - name: Execute sweep schedule tests
        run: /tmp/dead-air-sweep-tests
      - name: Compile ectoplasm palette with warnings as errors
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Iapps/orcsdr-tab5/ui \
            tests/dead_air_palette_tests.cpp \
            apps/orcsdr-tab5/ui/dead_air_palette.cpp \
            -o /tmp/dead-air-palette-tests
      - name: Execute palette tests
        run: /tmp/dead-air-palette-tests
      - name: Compile audio meter and detector with warnings as errors
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Iapps/orcsdr-tab5/ui \
            tests/dead_air_audio_tests.cpp \
            apps/orcsdr-tab5/ui/dead_air_audio.cpp \
            apps/orcsdr-tab5/ui/dead_air_model.cpp \
            -o /tmp/dead-air-audio-tests
      - name: Execute audio tests
        run: /tmp/dead-air-audio-tests
      - name: Compile clip planner with warnings as errors
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Iapps/orcsdr-tab5/ui \
            tests/dead_air_clip_tests.cpp \
            apps/orcsdr-tab5/ui/dead_air_clip.cpp \
            -o /tmp/dead-air-clip-tests
      - name: Execute clip planner tests
        run: /tmp/dead-air-clip-tests
      - name: Compile event-row formatting with warnings as errors
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Iapps/orcsdr-tab5/ui \
            tests/dead_air_format_tests.cpp \
            apps/orcsdr-tab5/ui/dead_air_format.cpp \
            apps/orcsdr-tab5/ui/dead_air_model.cpp \
            -o /tmp/dead-air-format-tests
      - name: Execute formatting tests
        run: /tmp/dead-air-format-tests
      - name: Compile (i) popup text with warnings as errors
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror             -Iapps/orcsdr-tab5/ui             tests/dead_air_info_tests.cpp             apps/orcsdr-tab5/ui/dead_air_info.cpp             -o /tmp/dead-air-info-tests
      - name: Execute popup text tests
        run: /tmp/dead-air-info-tests
      - name: Compile band plan with warnings as errors
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Iapps/orcsdr-tab5/ui \
            tests/dead_air_bandplan_tests.cpp \
            apps/orcsdr-tab5/ui/dead_air_bandplan.cpp \
            -o /tmp/dead-air-bandplan-tests
      - name: Execute band plan tests
        run: /tmp/dead-air-bandplan-tests
      - name: Compile control run with warnings as errors
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Iapps/orcsdr-tab5/ui \
            tests/dead_air_control_tests.cpp \
            apps/orcsdr-tab5/ui/dead_air_control.cpp \
            apps/orcsdr-tab5/ui/dead_air_model.cpp \
            -o /tmp/dead-air-control-tests
      - name: Execute control run tests
        run: /tmp/dead-air-control-tests
      - name: Compile orb animation with warnings as errors
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Iapps/orcsdr-tab5/ui \
            tests/dead_air_fx_tests.cpp \
            apps/orcsdr-tab5/ui/dead_air_fx.cpp \
            -o /tmp/dead-air-fx-tests
      - name: Execute orb animation tests
        run: /tmp/dead-air-fx-tests
      - name: Compile session stats with warnings as errors
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Iapps/orcsdr-tab5/ui \
            tests/dead_air_stats_tests.cpp \
            apps/orcsdr-tab5/ui/dead_air_stats.cpp \
            apps/orcsdr-tab5/ui/dead_air_model.cpp \
            -o /tmp/dead-air-stats-tests
      - name: Execute session stats tests
        run: /tmp/dead-air-stats-tests
      - name: Compile ENV III sensor logic with warnings as errors
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Iapps/orcsdr-tab5/ui \
            tests/dead_air_env_tests.cpp \
            apps/orcsdr-tab5/ui/dead_air_env.cpp \
            -o /tmp/dead-air-env-tests
      - name: Execute ENV III sensor tests
        run: /tmp/dead-air-env-tests
      - name: Compile environment event detector with warnings as errors
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Iapps/orcsdr-tab5/ui \
            tests/dead_air_envevents_tests.cpp \
            apps/orcsdr-tab5/ui/dead_air_envevents.cpp \
            apps/orcsdr-tab5/ui/dead_air_model.cpp \
            -o /tmp/dead-air-envevents-tests
      - name: Execute environment event tests
        run: /tmp/dead-air-envevents-tests
      - name: Compile environment history with warnings as errors
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Iapps/orcsdr-tab5/ui \
            tests/dead_air_envhistory_tests.cpp \
            apps/orcsdr-tab5/ui/dead_air_envhistory.cpp \
            apps/orcsdr-tab5/ui/dead_air_model.cpp \
            -o /tmp/dead-air-envhistory-tests
      - name: Execute environment history tests
        run: /tmp/dead-air-envhistory-tests
      - name: Compile VEIL-26 engine and records with warnings as errors
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Iapps/orcsdr-tab5/ui \
            tests/dead_air_veil26_tests.cpp \
            apps/orcsdr-tab5/ui/dead_air_veil26.cpp \
            -o /tmp/dead-air-veil26-tests
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Iapps/orcsdr-tab5/ui \
            tests/dead_air_veil26_log_tests.cpp \
            apps/orcsdr-tab5/ui/dead_air_veil26_log.cpp \
            apps/orcsdr-tab5/ui/dead_air_runes.cpp \
            apps/orcsdr-tab5/ui/dead_air_veil26.cpp \
            -o /tmp/dead-air-veil26-log-tests
      - name: Compile rune mapping and records with warnings as errors
        run: |
          python3 -I tests/dead_air_runes_vectors.py
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Iapps/orcsdr-tab5/ui tests/dead_air_runes_tests.cpp \
            apps/orcsdr-tab5/ui/dead_air_runes.cpp \
            apps/orcsdr-tab5/ui/dead_air_veil26.cpp \
            apps/orcsdr-tab5/ui/dead_air_veil26_log.cpp -o /tmp/dead-air-runes-tests
          /tmp/dead-air-runes-tests
      - name: Execute VEIL-26 tests
        run: |
          /tmp/dead-air-veil26-tests
          /tmp/dead-air-veil26-log-tests
