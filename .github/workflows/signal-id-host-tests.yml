name: Signal ID Host Tests
on:
  push:
    branches:
      - codex/machine-learning
    paths:
      - "apps/orcsdr-tab5/ui/signal_id.*"
      - "tests/signal_id_tests.cpp"
      - "tools/test-signal-id.sh"
      - ".github/workflows/signal-id-host-tests.yml"
  pull_request:
    paths:
      - "apps/orcsdr-tab5/ui/signal_id.*"
      - "tests/signal_id_tests.cpp"
      - "tools/test-signal-id.sh"
      - ".github/workflows/signal-id-host-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile and exercise detector
        run: bash tools/test-signal-id.sh
      - name: Attach host test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signal-id-host-log
          path: signal-id-host-test.log
          retention-days: 14
