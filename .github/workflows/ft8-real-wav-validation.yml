name: FT8 External WAV Validation

on:
  push:
    branches:
      - codex/ft8-native-decoder-research
    paths:
      - tools/ft8-wav-benchmark.cpp
      - tools/benchmark-ft8-wav.sh
      - apps/orcsdr-tab5/ui/ft8_*.cpp
      - apps/orcsdr-tab5/ui/ft8_*.hpp
      - .github/workflows/ft8-real-wav-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wsjtx-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download official WSJT-X receive samples
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-delay 2 \
            -o /tmp/210703_133430.wav \
            https://downloads.sourceforge.net/project/wsjt/samples/FT8/210703_133430.wav
          echo "9feb99c275770a6618538026da7decc6b09eb6cf63121e5168fa86dcdf00c2f5  /tmp/210703_133430.wav" \
            | sha256sum -c -
          file /tmp/210703_133430.wav

          for sample in 000000_000002.wav 190106_000112.wav 190106_000115.wav; do
            curl -L --fail --retry 4 --retry-delay 2 \
              -o "/tmp/$sample" \
              "https://downloads.sourceforge.net/project/wsjt/samples/FT4/$sample"
            sha256sum "/tmp/$sample"
            file "/tmp/$sample"
          done
      - name: Run WSJT-X command-line reference decoder
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wsjtx
          command -v jt9
          jt9 -8 -F 200 -f 1500 /tmp/210703_133430.wav | tee /tmp/wsjtx-ft8-reference.txt
          reference_count="$(grep -Ec '^[0-9]{6}[[:space:]]' /tmp/wsjtx-ft8-reference.txt || true)"
          echo "WSJTX_FT8_REFERENCE_DECODE_COUNT=$reference_count"

          for sample in 000000_000002.wav 190106_000112.wav 190106_000115.wav; do
            echo "WSJTX_FT4_REFERENCE_FILE=$sample"
            jt9 --ft4 -d 3 "/tmp/$sample" | tee "/tmp/wsjtx-ft4-$sample.txt"
            ft4_reference_count="$(grep -Ec '^[0-9]{6}[[:space:]]' "/tmp/wsjtx-ft4-$sample.txt" || true)"
            echo "WSJTX_FT4_REFERENCE_DECODE_COUNT=$ft4_reference_count"
          done

      - name: Run OrcSDR native FT8 receive benchmark
        run: |
          set -euo pipefail
          set -o pipefail
          /usr/bin/time -f 'FT8_BENCH_WALL_SECONDS=%e' \
            bash tools/benchmark-ft8-wav.sh /tmp/210703_133430.wav 2 1 \
            | tee /tmp/orcsdr-ft8-bench.txt
          grep -Eq 'decoded=[1-9][0-9]*' /tmp/orcsdr-ft8-bench.txt
          grep -F 'text=WM3PEN EA6VQ -09' /tmp/orcsdr-ft8-bench.txt

      - name: Run OrcSDR native FT4 receive benchmarks
        run: |
          set -euo pipefail
          set -o pipefail
          for sample in 000000_000002.wav 190106_000112.wav 190106_000115.wav; do
            echo "ORCSDR_FT4_FILE=$sample"
            /usr/bin/time -f 'FT4_BENCH_WALL_SECONDS=%e' \
              bash tools/benchmark-ft8-wav.sh "/tmp/$sample" 2 1 ft4 \
              | tee "/tmp/orcsdr-ft4-$sample.txt"
            grep -E '^FTX_WAV_BENCH mode=FT4 ' "/tmp/orcsdr-ft4-$sample.txt"
          done

          primary=/tmp/orcsdr-ft4-000000_000002.wav.txt
          grep -Eq 'decoded=([2-9]|[1-9][0-9]+)' "$primary"
          grep -F 'text=K4SQC VE3RX RR73' "$primary"
          grep -F 'text=WD9IGY KX1X 73' "$primary"
