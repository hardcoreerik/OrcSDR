name: Radio Service v1 contract
on:
  push:
    branches:
      - 'agents/radio-contract-*'
    paths:
      - 'contracts/radio_service/**'
      - 'tests/radio_service_v1/**'
      - '.github/workflows/radio-service-contract.yml'
  pull_request:
    paths:
      - 'contracts/radio_service/**'
      - 'tests/radio_service_v1/**'
      - '.github/workflows/radio-service-contract.yml'
permissions:
  contents: read
jobs:
  host-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema>=4.21,<5'
      - run: python -m unittest discover -s tests/radio_service_v1 -v
