name: Radio scan core

on:
  pull_request:
    paths:
      - apps/orcsdr-tab5/ui/radio_session.*
      - apps/orcsdr-tab5/ui/scan_engine.*
      - apps/orcsdr-tab5/ui/cb_scanner.*
      - apps/orcsdr-tab5/ui/airband_scanner.*
      - apps/orcsdr-tab5/ui/airband_catalog.*
      - tests/radio_scan_tests.cpp
      - tests/cb_scanner_tests.cpp
      - tests/airband_scanner_tests.cpp
      - tests/airband_catalog_tests.cpp
      - tools/test-radio-scan.ps1
      - tools/test-radio-scan.sh
      - .github/workflows/radio-scan-tests.yml
  push:
    branches: [main]
    paths:
      - apps/orcsdr-tab5/ui/radio_session.*
      - apps/orcsdr-tab5/ui/scan_engine.*
      - apps/orcsdr-tab5/ui/cb_scanner.*
      - apps/orcsdr-tab5/ui/airband_scanner.*
      - apps/orcsdr-tab5/ui/airband_catalog.*
      - tests/radio_scan_tests.cpp
      - tests/cb_scanner_tests.cpp
      - tests/airband_scanner_tests.cpp
      - tests/airband_catalog_tests.cpp
      - tools/test-radio-scan.ps1
      - tools/test-radio-scan.sh
      - .github/workflows/radio-scan-tests.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One live run per PR: a new push cancels that PR's older run.
  # Every non-PR run (push to main, schedule, workflow_dispatch) gets its own
  # group via run_id, so it is never queued behind or cancelled by another run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Optimized and sanitizer tests
        run: bash tools/test-radio-scan.sh
