dependencies:
  idf:
    version: ">=5.5.0,<5.6.0"
  esp_rtl_sdr:
    git: https://github.com/hardcoreerik/esp-rtl-sdr.git
    # Same immutable pin as apps/orcsdr-tab5 (esp_rtl_sdr v0.9.5): the shared screens call this driver's current API.
    version: 4bf017195502d1a413e155d5a79aee7cd086035b
  esp-pluto-sdr:
    git: https://github.com/hardcoreerik/esp-pluto-sdr.git
    # PlutoSDR iiod client, IQ conversion and USB transport (receive only). Immutable pin; the driver never depends on OrcSDR.
    version: 49fada6ee3b12d8233b3a4076a3a7cd380c6afff
  orcmaps:
    git: https://github.com/hardcoreerik/OrcMaps.git
    # Same immutable pin as apps/orcsdr-tab5, so the map engine is identical on every OrcSDR build.
    version: 6a621a70ebbf7906b1d6c089bd61dbbc456475ed
  espressif/esp_hosted:
    version: "3.0.6"
  espressif/esp_wifi_remote:
    version: ">=1.3.1"
  espressif/esp-dsp:
    version: "^1.3.4"
  m5stack/m5gfx:
    # Same pin as apps/orcsdr-tab5: the drawing engine the Tab5 UI is written against.
    version: "0.2.27"
