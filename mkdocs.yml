site_name: OrcSDR User Guide
site_description: Beginner-first operating guide and technical reference for OrcSDR
site_url: https://hardcoreerik.github.io/OrcSDR/
docs_dir: docs/user-guide
site_dir: site
theme:
  name: material
  palette:
    scheme: slate
    primary: black
    accent: light green
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
strict: true
